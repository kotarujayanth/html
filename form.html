<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center>
        <img src="./FE-BE/head of bus pass.jpg" width="80%" height="200"
        <form>
            <fieldset>
                <legend>Application Form</legend>
                    <table width="70%" cellpadding="15" border="0">
                    <tr>
                        <td><label for="Firstname" >Name*</label></td>
                        <td><input type="text" name="Firstname" id="Firstname" required maximum="20"></td>
                        <td><label for="Secondname">Father Name*:</label></td>
                        <td><input type="text" name="Secondname" id="Secondname" required maximum="20"></td>
                    </tr>
                    <tr>
                        <td><label for="date">Date of Birth*</label></td>
                        <td><input type="date" name="date" id="date" required></td>
                        <td><label for="gender">Gender*</label></td>
                        <td>
                            <label for="male">Male</label>
                            <input type="radio" id="male" name="gender" value="male">
                            <label >Female</label>
                            <input type="radio" id="female" name="gender" value="female">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">Age as on*</label></td>
                        <td>
                            <input type="text" name="year" id="name" size="1">
                            <label for="year">year</label>
                            <input type="text" name="month" id="month" size="1">
                            <label for="month">month</label>
                            <input type="text" name="day" id="day" size="1">
                            <label for="day">day</label>
                        </td>
                        <td><label for="aadhaar">Aadhaar No: </label></td>
                        <td><input type="number" name="aadhaar" id="aadhaar" maxlength="12" minlength="12" required></td>
                        
                    </tr>
                    <tr>
                        <td><label for="whatsapp">Whatsapp No:</label></td>
                        <td><input type="number" name="whatsapp" id="whatsapp" required></td>
                        <td><label for="email">Email id*</label></td>
                        <td><input type="text" name="email" id="email"></td>
                    </tr>
                    <tr>
                        <td><label for="photo">Photos*</label></td>
                        <td><input type="file" name="photo" id="photo"></td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>Residential Address Details</legend>
                <table align="center" cellpadding="15" width="70%">
                    <tr>
                        <td><label for="address">Applicant's Address*</label></td>
                        <td><textarea name="address" id="address"> </textarea></td>
                        <td><label for="district">District*</label></td>
                        <td>
                            <select name="district" id="district">
                                <option value="hyderabad">hyderabad</option>
                                <option value="Vishakapatanam">Vishakapatanam</option>
                                <option value="Eluru">Eluru</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="mandal">Mandal*</label></td>
                        <td>
                            <select name="mandal" id="mandal">
                                <option value="hyderabad">Hyderabad</option>
                                <option value="Vishakapatanam">Vishakapatanam</option>
                                <option value="Eluru">Eluru</option>
                            </select>
                        </td>
                        <td><label for="village">Village*</label></td>
                        <td>
                            <select name="village" id="village">
                                <option value="hyderabad">hyderabad</option>
                                <option value="Vishakapatanam">Vishakapatanam</option>
                                <option value="Eluru">Eluru</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="pincode">Pincode*</label></td>
                        <td><input type="text" id="pincode" name="pincode"></td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>Pass Type Details*</legend>
                <table align="center" width="70%" cellpadding="15">
                    <tr>
                        <td><label for="city">City*</label></td>
                        <td>
                            <select id="city" name="city">
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Vishakapatanam">Vishakapatanam</option>
                                <option value="Eluru">Eluru</option>
                            </select>
                        </td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td><label for="pass">Pass Type*</label></td>
                        <td>
                            <select name="pass" id="pass">
                                <option value="">--select--</option>
                            </select>
                           
                        </td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>Mode of Payment & Pass Collection</legend>
                    <table width="70%" cellpadding="15">
                        <tr>
                            <td><label for="payment">Payment Mode*:</label></td>
                            <td>
                            <select id="payment" name="payment" required>
                            <option value="">Select Payment Mode</option>
                            <option value="online">Payment at Counter</option>
                            </select>
                            </td>
                            </tr>
                            <tr>
                            <td><label for="delivery">Pass Delivery Mode*:</label></td>
                            <td>
                            <select id="delivery" name="delivery" required>
                            <option value="">Select Pass Delivery Mode</option>
                            <option value="counter">At Counter</option>
                            </select>
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><label for="center">Center to Collect Pass*:</label></td>
                            <td>
                            <select id="center" name="center" required>
                            <option value="">Select</option>
                            <option value="secunderabad">Secunderabad</option>
                            <option value="mehdipatnam">Mehdipatnam</option>
                            </select>
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                    </table>
            </fieldset>
            <img src="./FE-BE/capcha.jpg"> <br><br>
            <input type="text"><br><br>
            <input type="submit">
    </center>
</body>
</html>
